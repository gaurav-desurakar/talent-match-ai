name: Bug report
description: Report reproducible product behavior without sharing candidate data or secrets
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include real resumes, personal information, or API keys."
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Use fictional or redacted content only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
