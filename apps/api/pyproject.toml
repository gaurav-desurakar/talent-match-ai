[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talentmatch-api"
version = "0.1.0"
description = "Evidence-based TalentMatch AI API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pypdf>=6.0,<7.0",
  "pydantic-settings>=2.7,<3.0",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.28,<1.0",
  "reportlab>=4.2,<5.0",
  "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pymupdf>=1.26,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "types-reportlab>=4.2,<5.0",
]

[tool.uv]
required-version = ">=0.11.28,<0.12"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
